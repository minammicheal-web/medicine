plugins { id 'com.android.application' }
def run = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
android {
    namespace 'com.mina.medicine'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mina.medicine'
        minSdk 24
        targetSdk 34
        versionCode run as Integer
        versionName "1.${run}"
    }
    signingConfigs {
        release {
            storeFile rootProject.file('../android-key/medicine.jks')
            storePassword 'medicine123'
            keyAlias 'medicine'
            keyPassword 'medicine123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
